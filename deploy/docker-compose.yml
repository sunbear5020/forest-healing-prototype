# 단일 서버(1단계) 실행 예: docker compose -f deploy/docker-compose.yml up --build
services:
  api:
    build: { context: .., dockerfile: Dockerfile }
    image: soopgyeol-api:0.6.1
    ports: ["8080:8080"]
    environment:
      ALLOWED_ORIGINS: "https://sunbear5020.github.io,capacitor://localhost,https://localhost,http://localhost:8000"
    read_only: true
    restart: unless-stopped
